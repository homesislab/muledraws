name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mysqli, pdo, pdo_mysql, gd
        tools: composer:v2

    - name: Validate composer.json and composer.lock
      run: composer validate --strict || echo "Validation failed, but continuing..."

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Check PHP Syntax
      run: find . -name "*.php" ! -path "./vendor/*" -print0 | xargs -0 -n1 php -l

    # If you write tests later, you can uncomment this step to run PHPUnit
    # - name: Run tests with PHPUnit
    #   run: vendor/bin/phpunit

  build-and-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ghcr.io/homesislab/muledraws:latest
          ghcr.io/homesislab/muledraws:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment: home

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install kubectl
      uses: azure/setup-kubectl@v3

    - name: Configure kubeconfig
      env:
        KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
      run: |
        mkdir -p ~/.kube
        echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
        chmod 600 ~/.kube/config

    - name: Create namespace if not exists
      run: kubectl create namespace muledraws --dry-run=client -o yaml | kubectl apply -f -

    - name: Create GHCR image pull secret
      env:
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        kubectl create secret docker-registry ghcr-secret \
          --docker-server=ghcr.io \
          --docker-username=${{ github.actor }} \
          --docker-password=$GHCR_TOKEN \
          --namespace=muledraws \
          --dry-run=client -o yaml | kubectl apply -f -

    - name: Create database secret
      env:
        DB_HOSTNAME: ${{ secrets.DB_HOSTNAME }}
        DB_USERNAME: ${{ secrets.DB_USERNAME }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        DB_DATABASE: ${{ secrets.DB_DATABASE }}
      run: |
        kubectl create secret generic muledraws-secret \
          --from-literal=DB_HOSTNAME="$DB_HOSTNAME" \
          --from-literal=DB_USERNAME="$DB_USERNAME" \
          --from-literal=DB_PASSWORD="$DB_PASSWORD" \
          --from-literal=DB_DATABASE="$DB_DATABASE" \
          --namespace=muledraws \
          --dry-run=client -o yaml | kubectl apply -f -

    - name: Deploy to Kubernetes
      run: |
        kubectl apply -f k8s/deployment.yaml
        kubectl rollout restart deployment/muledraws -n muledraws
        kubectl rollout status deployment/muledraws -n muledraws --timeout=120s
