name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mysqli, pdo, pdo_mysql, gd
        tools: composer:v2

    - name: Validate composer.json and composer.lock
      run: composer validate --strict || echo "Validation failed, but continuing..."

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Check PHP Syntax
      run: find . -name "*.php" ! -path "./vendor/*" -print0 | xargs -0 -n1 php -l

    # If you write tests later, you can uncomment this step to run PHPUnit
    # - name: Run tests with PHPUnit
    #   run: vendor/bin/phpunit

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment: home
    
    steps:
    - name: Install Cloudflared
      run: |
        curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
        sudo dpkg -i cloudflared.deb

    - name: Deploy to Server (Native SSH)
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
        SSH_USER: ${{ secrets.SSH_USER }}
        CF_ID: ${{ secrets.CF_CLIENT_ID }}
        CF_SECRET: ${{ secrets.CF_CLIENT_SECRET }}
      run: |
        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        
        echo "Host ssh.homesislab.my.id" >> ~/.ssh/config
        echo "  StrictHostKeyChecking no" >> ~/.ssh/config
        echo "  User $SSH_USER" >> ~/.ssh/config
        echo "  ProxyCommand cloudflared access ssh --hostname %h --id $CF_ID --secret $CF_SECRET" >> ~/.ssh/config

        ssh ssh.homesislab.my.id << 'EOF'
          cd /home/gie/workspace/muledraws
          git fetch origin main
          git reset --hard origin/main
          docker compose up -d --build
          docker image prune -f
        EOF
