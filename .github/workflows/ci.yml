name: Muledraws CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4

    - name: Prepare .env from Secrets
      env:
        DB_HOSTNAME: ${{ secrets.DB_HOSTNAME }}
        DB_USERNAME: ${{ secrets.DB_USERNAME }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        DB_DATABASE: ${{ secrets.DB_DATABASE }}
      run: |
        TARGET_DIR="/home/gie/workspace/muledraws"
        echo "Preparing .env in $TARGET_DIR"
        cd $TARGET_DIR || exit 1

        # Merge secrets into existing .env without overwriting unrelated variables
        update_env() {
          local key=$1
          local value=$2
          if [ -z "$value" ]; then return; fi
          if grep -q "^${key}=" .env 2>/dev/null; then
            sed -i "s|^${key}=.*|${key}=${value}|" .env
          else
            echo "${key}=${value}" >> .env
          fi
        }

        # Ensure .env exists (fallback to example or empty)
        [ -f .env ] || cp .env.example .env 2>/dev/null || touch .env

        update_env "DB_HOSTNAME" "$DB_HOSTNAME"
        update_env "DB_USERNAME" "$DB_USERNAME"
        update_env "DB_PASSWORD" "$DB_PASSWORD"
        update_env "DB_DATABASE" "$DB_DATABASE"

        # Fix .env permissions so www-data (in container) can read it
        chmod 644 .env

    - name: Deploy to Server
      run: |
        TARGET_DIR="/home/gie/workspace/muledraws"
        echo "Deploying to $TARGET_DIR"
        
        # Navigate to target directory
        cd $TARGET_DIR || exit 1
        
        # Pull latest changes from git
        # Note: Handling both main and master branch conventions
        git fetch origin main || git fetch origin master
        git reset --hard origin/main || git reset --hard origin/master
        
        # Bring up services and build changes
        docker compose up -d --build --remove-orphans
        
        # Cleanup unused images
        docker image prune -f
